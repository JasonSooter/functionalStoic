# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: functionalStoic
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # Google Analytics is loaded by plugins/site-nav (googleAnalyticsId).
  analytics: null
  locale: en-US
  baseUrl: www.jasonsooter.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - People/Family
    - People/Family/**
    - People/Friends
    - People/Friends/**
    - Archives
    - Archives/**
    - "**/*Journal Entries*"
    - "**/*Weekly Review*"
    - "**/*Year-End Review*"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Space Grotesk
      body: Space Grotesk
      code: IBM Plex Mono
    # Nord (https://www.nordtheme.com): Snow Storm for light mode, Polar Night for
    # dark, Frost blues as the accent. Tag green lives in custom.scss (--tag).
    colors:
      lightMode:
        light: "#eceff4"
        lightgray: "#d8dee9"
        gray: "#5c667a"
        darkgray: "#3b4252"
        dark: "#2e3440"
        secondary: "#5e81ac"
        tertiary: "#4c6a92"
        highlight: rgba(94, 129, 172, 0.12)
        textHighlight: "#ebcb8b88"
      darkMode:
        light: "#2e3440"
        lightgray: "#3b4252"
        gray: "#8b95a7"
        darkgray: "#d8dee9"
        dark: "#eceff4"
        secondary: "#88c0d0"
        tertiary: "#8fbcbb"
        highlight: rgba(136, 192, 208, 0.15)
        textHighlight: "#ebcb8b55"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  # Links emoji-leading tags (#📚/…, #🗓️/…) that remark-obsidian's tokenizer drops,
  # and undoes crawl-links' truncation of tag text. Ordered above both: its markdown
  # pass must follow obsidian-flavored-markdown (30) and its html pass crawl-links (60).
  - source: ./plugins/emoji-tags
    enabled: true
    order: 61
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: true
    options:
      bibliographyFile: ./bibliography.bib
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  # Without options this plugin falls back to Quartz's default fonts (Schibsted
  # Grotesk / Source Sans Pro) and overrides the theme typography above.
  - source: github:quartz-community/fonts
    enabled: true
    options:
      header:
        name: Space Grotesk
        weights: [400, 500, 600, 700]
      body:
        name: Space Grotesk
        weights: [400, 500, 600, 700]
      code: IBM Plex Mono
  - source: github:quartz-community/remove-draft
    enabled: false
  - source: github:quartz-community/explicit-publish
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:JasonSooter/quartz-graph
    enabled: true
    layout:
      position: right
      priority: 10
    options:
      localGraph:
        showTags: false
        depth: 2
      globalGraph:
        showTags: false
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: header
      priority: 20
      group: toolbar
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  # Notes already open with an H1 matching `title` (Obsidian Linter convention),
  # so rendering the frontmatter title here duplicates it.
  - source: github:quartz-community/article-title
    enabled: false
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  # Off for now: on the reading lists this block runs to dozens of date pills and
  # swamped the page. Tags remain clickable inline and keep their own tag pages.
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: afterBody
      priority: 10
  # The site title lives in site-nav's top bar now.
  - source: github:quartz-community/page-title
    enabled: false
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: header
      priority: 25
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        Email: mailto:hello@jasonsooter.com
        GitHub: https://github.com/JasonSooter
        LinkedIn: https://www.linkedin.com/in/jason-sooter/
        Uses: /blog/uses
        Questions: /blog/questions
        RSS: /feed.xml
    layout:
      position: footer
      priority: 50
  # Each entry rendered its full tag list, so a reading list showed ~45 date pills
  # and nothing else. Show just the title and date.
  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      showTags: false
      limit: 4
    # The home page has blog-extras' own "Recently updated notes" list; on note
    # pages custom.scss pushes this block down to sit just above the footer.
    layout:
      position: afterBody
      priority: 30
      condition: not-index
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:JasonSooter/quartz-geo-map
    enabled: true
    order: 45
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  # Top bar from the old jasonsooter.com: site title + section links, and GA.
  - source: ./plugins/site-nav
    enabled: true
    options:
      title: "𝑓(S) functionalStoic"
      googleAnalyticsId: G-X6H4S6KLTW
      links:
        Blog: /blog
        Notes: /notes
        Bookshelf: /bookshelf
        Projects: /projects
        About: /about
        Tags: /tags
    layout:
      position: header
      priority: 10
  # Old PostLayout: centered date + title, author/tags/prev-next column.
  - source: ./plugins/post-layout
    enabled: true
    options:
      author: Jason Sooter
      avatar: /attachments/jason-sooter-avatar.png
      authorHref: /about
    layout:
      position: beforeBody
      priority: 1
  # Absolute og:image URLs from a note's image/socialImage vault path.
  - source: ./plugins/social-image
    enabled: true
    order: 95
  # Posts-only RSS at the old site's /feed.xml.
  - source: ./plugins/blog-feed
    enabled: true
    options:
      title: functionalStoic
      description: Blog posts by Jason Sooter
  # Home-page feed, plus Giscus comments after blog posts.
  - source: ./plugins/blog-extras
    enabled: true
    options:
      postLimit: 4
      noteLimit: 6
      giscus:
        repo: JasonSooter/functionalStoic
        repoId: R_kgDOQwvlIg
        # Announcement-type, so only Giscus (on a reader's first comment) and
        # maintainers can open threads.
        category: Announcements
        categoryId: DIC_kwDOQwvlIs4DIqiP
    layout:
      position: afterBody
      priority: 20
  - source: github:JasonSooter/quartz-folder-note-links
    enabled: true
    order: 65
    options: {}
layout:
  groups:
    toolbar:
      priority: 20
      direction: row
      gap: 0.5rem
  byPageType:
    # full-width (not minimal) keeps the site-nav header; blog-extras renders the
    # body, after the old site's not-found page.
    "404":
      template: full-width
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
    tag:
      exclude:
        - reader-mode
    canvas: {}
    bases: {}
