name: Sync upstream Quartz v5

# This site is a fork of jackyzha0/quartz. Core updates come from upstream
# (vetted together), not from one-off Dependabot version bumps. This workflow
# merges upstream/v5 monthly and opens a PR to review + deploy.
on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

# Only one sync at a time so a scheduled run and a manual dispatch can't race on
# the branch push / duplicate PRs. Queue, don't cancel an in-flight merge.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        # Pinned to a commit SHA (not a moving tag) for supply-chain safety.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Merge upstream/v5 and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/jackyzha0/quartz.git
          # Explicit refspec so refs/remotes/upstream/v5 always exists (a bare
          # `fetch upstream v5` can miss it on a tag-name collision).
          git fetch --no-tags upstream +refs/heads/v5:refs/remotes/upstream/v5

          if git merge-base --is-ancestor upstream/v5 HEAD; then
            echo "Already up to date with upstream/v5 — nothing to sync."
            exit 0
          fi

          BRANCH="sync/upstream-v5-$(date +%Y%m%d)-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"

          # This fork intentionally diverges from upstream and hits predictable
          # add/delete conflicts every sync: it removed upstream's CI workflows
          # (deploy is on Vercel) and keeps a quartz.lock.json upstream lacks.
          # Auto-resolve those in the fork's favour; only genuine *content*
          # conflicts should stop the sync for manual review.
          if ! git merge --no-edit upstream/v5; then
            git status --porcelain | while IFS= read -r line; do
              code=$(printf '%s' "$line" | cut -c1-2)
              path=$(printf '%s' "$line" | cut -c4-)
              case "$code" in
                DU | DD) git rm -f --ignore-unmatch "$path" || true ;; # deleted by us -> keep deleted
                UD) git add -- "$path" || true ;;                     # deleted by them -> keep ours
              esac
            done
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Upstream sync has content conflicts needing manual resolution:"
              git diff --name-only --diff-filter=U || true
              echo "Resolve locally: git fetch upstream && git merge upstream/v5"
              exit 1
            fi
            git commit --no-edit
          fi

          git push origin "$BRANCH"

          # Conventional-commit title + the repo's standard PR description template.
          TITLE="chore(deps): sync upstream Quartz v5 ($(date +%Y-%m-%d))"
          BODY=$'## Before this PR\n- The fork is behind `jackyzha0/quartz@v5`.\n\n## After this PR\n- Merged the latest upstream Quartz `v5` (engine, CLI, components, deps). Fork-specific divergences (removed CI workflows, kept `quartz.lock.json`) were auto-resolved in favour of the fork.\n\n## Reason that prompted this change\n- Scheduled/manual upstream sync to pick up upstream fixes and improvements.\n\n## Test Plan\n- Review the diff and confirm the Vercel preview build is green + key pages render.'

          # Try to open the PR automatically. If that fails the branch is already
          # pushed, so the sync itself is fine — but the job must still FAIL.
          # GitHub only notifies on failed workflows by default, so exiting 0 here
          # meant a silent green run and a sync branch nobody knew about.
          if PR_ERR=$(gh pr create --base main --head "$BRANCH" \
            --title "$TITLE" --body "$BODY" 2>&1); then
            echo "Opened the sync PR: $PR_ERR"
            exit 0
          fi

          ET=$(jq -rn --arg s "$TITLE" '$s|@uri')
          EB=$(jq -rn --arg s "$BODY" '$s|@uri')
          COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1&title=${ET}&body=${EB}"

          # Report what actually went wrong. "Resource not accessible by
          # integration (createPullRequest)" means Settings → Actions → General →
          # "Allow GitHub Actions to create and approve pull requests" is off.
          echo "::error::Sync branch pushed but the PR could not be opened: ${PR_ERR}"
          {
            echo "### Upstream sync branch pushed, PR not opened 🔴"
            echo ""
            echo "The merge succeeded and \`$BRANCH\` is pushed, but opening the PR failed:"
            echo ""
            echo '```'
            echo "${PR_ERR}"
            echo '```'
            echo ""
            echo "If that reads \`Resource not accessible by integration\`, enable"
            echo "**Settings → Actions → General → Allow GitHub Actions to create and"
            echo "approve pull requests**, then re-run this workflow."
            echo ""
            echo "**[→ Create the sync PR now (pre-filled title + body)]($COMPARE)**"
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1
